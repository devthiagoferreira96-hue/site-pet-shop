# Banco PostgreSQL local para desenvolvimento: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: petshop
      POSTGRES_PASSWORD: troque-esta-senha-local
      POSTGRES_DB: petshop
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dados:/var/lib/postgresql/data"]
volumes:
  dados:
